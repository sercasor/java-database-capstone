<!--
Step-by-Step Explanation of `index.html`.
This file allows users to select a role (Admin, Patient, Doctor) 
and triggers modal-based login functionality.

-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>
            Select your role - Java Capstone: A Clinic Management System for serious business owners
        </title>
        <link rel="icon" href="/assets/images/logo/logo.png"  />
        <link rel="stylesheet" href="">
        <link rel="stylesheet" href="/assets/css/index.css">
        <link rel="stylesheet" href="/assets/css/style.css">
        <script src="js/util.js" defer></script>
        <script src="js/render.js" defer></script>
        <script src="js/components/header.js" defer></script>
        <script src="js/components/footer.js" defer></script>
        <script src="js/components/modals.js" defer></script>
        <script src="js/components/" defer></script>
    </head>
    <body>


        <main class="main-content">
            <!--MAIN CONTAINER: groups header, main, and footer sections logically-->
            <div class="container">
                <!--WRAPPER: groups sections-->
                <div class="wrapper">
                    <!--HEADER placeholder-->
                    <div id="header">

                    </div>

                    <h2>Select Your Role</h2>
                    <!--TODO: onclick handlers needed or document.addEventListener for dynamic role selection-->
                    <button id="adminButtonSelection">Admin</button>
                    <button id="doctorButtonSelection">Doctor</button>
                    <button id="patientButtonSelection">Patient</button>
                    <!--FOOTER placeholder-->
                    <div id="footer">

                    </div>
                    <!-- MODALS -->
                    <!--modal that is hidden by default and appears when triggered by an event listener.
                    The modal overlay is aimed towards popups (like login forms).
                    Has a close button and  a dynamic content area-->
                    <div id="modal" class="modal">
                        <button id="closeModal">
                        Close popup
                        </button>
                        <!--Modal Dynamic content area-->
                        <div id="modal-body">

                        </div>
                    </div>
                </div>

            </div>
        </main>
        <script type="module" src="/js/services/index.js" defer></script>
    </body>
</html>
