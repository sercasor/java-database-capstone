 spring.application.name=back-end
# support reading from .env file to get the environment variables.
# IMPORTANT: the path starts in app/ as that's the folder in which maven is executed (focus on where pom.xml is found)
# optional prevents springboot from stopping execution if the file is not found. e.g.: In production these variables may be inserted with other method
spring.config.import=optional:file:docker/.env[.properties]

# By default, data.sql scripts get executed before the Hibernate is initialized.
# We need Hibernate to create our tables before inserting the data into them.
# To achieve this, we need to defer the initialization of our data source. We’ll use the below property to achieve this:
spring.jpa.defer-datasource-initialization=true

# By default, SQL database initialization is only performed when using an embedded in-memory database.
# To always initialize an SQL database, irrespective of its type, we need this on always
spring.sql.init.mode=always

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/cms?usessl=false
spring.datasource.username=${DB_USER}

spring.datasource.password=${MY_SQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.mongodb.uri=mongodb://root:${MONGODB_PASSWORD}@${MONGODB_HOST}:27017/prescriptions?authSource=admin

management.endpoint.health.show-details=always
management.health.db.enabled=true


api.path=/
jwt.secret=$!@#$^%$$$%####$DDCPN0234FCFDPD8670M


# tells Spring Boot where to look for static assets (e.g., CSS, JS, images).
# Spring will serve those assets without the need of a controller. eg: src/main/resources/static/css/style.css will be accessible at http://localhost:8080/css/style.css
spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf Configuration
#defines template base directory, suffixes, rendering mode(html), whether cache is activated  and encoding so we dont' have to specify all that
# -------------------------

spring.thymeleaf.prefix=classpath:/templates/
#You can return "admin/adminDashboard" and Spring will resolve it to admin/adminDashboard.html.
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
#(useful to see changes without app restart)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
